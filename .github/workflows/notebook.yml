name: Run notebook

on:
  push:
    branches: [main]
  pull_request:

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: jupyter nbconvert --to notebook --execute analysis.ipynb --output /tmp/executed.ipynb
